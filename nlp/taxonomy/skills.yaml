# Canonical skill taxonomy — versioned input to the extractor.
#
# Every posting_skills row is stamped with this version; bump it on ANY edit so
# re-extraction over the raw zone stays reproducible and auditable.
#
# match_policy:
#   plain          (default) case-insensitive token-boundary phrase match
#   case_sensitive exact-case token match — for skills that collide with common
#                  words when lowercased ("R", "C", "Go", "Excel")
#   context_required  case-sensitive AND a context_patterns regex must cover the
#                  mention — for one-letter names where exact case still isn't enough
#
# Seeding strategy (see plan Phase 2): curated start; grow toward ~300 by mapping
# against ESCO altLabels / Lightcast Open Skills, storing their IDs in `esco_uri`.

version: "2026.08.0"

skills:
  # ── Languages ────────────────────────────────────────────────────────────
  - {name: Python, category: language}
  - {name: SQL, category: language}
  - {name: Java, category: language}
  - {name: JavaScript, category: language, aliases: [JS]}
  - {name: TypeScript, category: language, aliases: [TS]}
  - name: R
    category: language
    match_policy: context_required
    context_patterns:
      - '\bR (?:programming|language|scripts?|packages?|Shiny|Studio)\b'
      - '\bin R\b'
      - '(?:Python|SQL|SAS|Scala|Julia)(?:,| and| or|/) ?R\b'
      - '\bR(?:,| and| or|/) ?(?:Python|SQL|SAS|Scala|Julia)\b'
  - name: C
    category: language
    match_policy: context_required
    context_patterns:
      - '\bC (?:programming|language)\b'
      - '\bin C\b'
      - '\bC/C\+\+'
  - {name: C++, category: language, aliases: [CPP]}
  - {name: C#, category: language, aliases: [C-Sharp, CSharp]}
  - name: Go
    category: language
    match_policy: context_required
    aliases: [Golang]
    context_patterns:
      # NOTE: unambiguous aliases self-validate — the '\bGolang\b' pattern covers
      # its own mention, so "Golang" needs no surrounding context while bare "Go" does.
      - '\bGo (?:programming|language|developer|services?|microservices)\b'
      - '\bin Go\b'
      - '\bGolang\b'
      - '(?:Python|Java|Rust|C\+\+|Node\.?js)(?:,| and| or|/) ?Go\b'
      - '\bGo(?:,| and| or|/) ?(?:Python|Java|Rust|C\+\+)\b'
  - {name: Rust, category: language}
  - {name: Scala, category: language}
  - {name: Kotlin, category: language}
  - {name: Swift, category: language}
  - {name: PHP, category: language}
  - {name: Ruby, category: language}
  - {name: Julia, category: language}
  - {name: MATLAB, category: language}
  - {name: SAS, category: language, match_policy: case_sensitive}
  - {name: Bash, category: language, aliases: [shell scripting]}

