name: collect

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Day-0 backfill (~30 days via max_days_old)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Collect
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          BACKFILL_FLAG=""
          if [ "${{ inputs.backfill }}" = "true" ]; then BACKFILL_FLAG="--backfill"; fi
          python -m ingestion.run budget --config config/pipeline.yaml || true
          python -m ingestion.run collect --config config/pipeline.yaml $BACKFILL_FLAG

      - name: Commit raw data (append-only, to main)
        run: |
          git config user.name "skill-trends-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No new data landed this run."
          else
            git commit -m "collect: $(date -u +%Y-%m-%dT%H:%MZ) run"
            git push
          fi
