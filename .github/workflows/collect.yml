name: collect

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Day-0 backfill (~30 days via max_days_old)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (collector code)
        uses: actions/checkout@v4

      - name: Checkout data-raw branch (raw zone)
        uses: actions/checkout@v4
        with:
          ref: data-raw
          path: raw-zone
        continue-on-error: true

      - name: Init raw zone if data-raw branch is missing
        run: |
          if [ ! -d raw-zone/.git ]; then
            mkdir -p raw-zone
            cd raw-zone
            git init -b data-raw
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            echo "# Raw landing zone (append-only, machine-written)" > README.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Collect
        working-directory: raw-zone
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          BACKFILL_FLAG=""
          if [ "${{ inputs.backfill }}" = "true" ]; then BACKFILL_FLAG="--backfill"; fi
          python -m ingestion.run budget --config "$GITHUB_WORKSPACE/config/pipeline.yaml"
          python -m ingestion.run collect --config "$GITHUB_WORKSPACE/config/pipeline.yaml" $BACKFILL_FLAG

      - name: Commit raw data (append-only)
        working-directory: raw-zone
        run: |
          git config user.name "skill-trends-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No new data landed."
          else
            git commit -m "collect: $(date -u +%Y-%m-%dT%H:%MZ) run"
            git push origin data-raw
          fi
